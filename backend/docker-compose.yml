services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: housepot
      POSTGRES_USER: housepot
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housepot -d housepot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
